name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vtc
          POSTGRES_PASSWORD: vtc
          POSTGRES_DB: vtc
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vtc -d vtc"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://vtc:vtc@localhost:5432/vtc?schema=public
      DATABASE_URL_UNPOOLED: postgresql://vtc:vtc@localhost:5432/vtc?schema=public
      NUXT_SESSION_PASSWORD: ci-session-password-at-least-32-characters
      LINK_TOKEN_SECRET: ci-link-token-secret-at-least-32-characters

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Prisma migrate
        run: npx prisma migrate deploy

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build
