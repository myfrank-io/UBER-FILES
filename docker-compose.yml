services:
  postgres:
    image: postgres:16-alpine
    container_name: vtc-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: vtc
      POSTGRES_PASSWORD: vtc
      POSTGRES_DB: vtc
    ports:
      - '5432:5432'
    volumes:
      - vtc-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U vtc -d vtc']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  vtc-pgdata:
